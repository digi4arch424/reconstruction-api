# =============================================================================
# reconstruction-api — Fly.io deployment config
# =============================================================================

app            = "reconstruction-api"
primary_region = "syd"

[build]

[env]
  ENVIRONMENT = "production"
  PORT        = "8000"

[http_service]
  internal_port        = 8000
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period  = "10s"
    interval      = "30s"
    method        = "GET"
    path          = "/health"
    timeout       = "10s"

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1
