# =============================================================================
# reconstruction-api — Fly.io deployment config
# Docs: https://fly.io/docs/reference/configuration/
# =============================================================================

app            = "reconstruction-api"
primary_region = "syd"

[build]

[env]
  ENVIRONMENT = "production"

[http_service]
  internal_port       = 8000
  force_https         = true
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1
